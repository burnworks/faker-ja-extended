kana = "ヤマザキ"
romaji = "Yamazaki"
tags = ["kanji_variant", "cp932_only"]
note = "「﨑」（たつさき、U+FA11）。CJK 互換漢字のブロックにあるが、統合漢字の扱いなので Unicode の正規化では変わらない。互換漢字だから正規化で変わると思い込んだ処理で問題になる"

[[surname]]
