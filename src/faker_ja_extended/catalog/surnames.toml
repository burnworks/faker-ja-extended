value = "髙橋"
base = "高橋"
kana = "タカハシ"
romaji = "Takahashi"
tags = ["kanji_variant", "cp932_only"]
note = "「髙」（はしご高、U+9AD9）。CP932 の拡張領域にはあるが、JIS X 0208 にはない。Shift_JIS や ISO-2022-JP の連携先で文字化けする"

[[surname]]
