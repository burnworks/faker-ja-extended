# 意地悪な姓のカタログ。
#
# 各エントリの項目:
#   id      一意な ID（テストの ID などに使う）
#   value   姓の表記
#   base    標準的な表記（異体字や表記の揺れの「元」。同じなら value と同じ）
#   kana    読み（カタカナ）
#   romaji  ローマ字（ヘボン式・パスポート式）
#   tags    性質を表すタグ（faker_ja_extended.nasty.TAGS を参照）
#   note    何が壊れやすいかの説明
#
# 見分けにくい文字（互換漢字、サロゲートペア、異体字セレクタ）は、
# 確認しやすいようエスケープ（\uXXXX、\UXXXXXXXX）で書く。
# タグの多くは tests/test_nasty.py で文字の性質と一致するか自動で検証している。

# --- 異体字（JIS X 0208 にあるもの）---

