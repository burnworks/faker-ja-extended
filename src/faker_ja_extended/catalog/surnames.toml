base = "徳永"
kana = "トクナガ"
romaji = "Tokunaga"
tags = ["kanji_variant", "cp932_only"]
note = "「德」（U+5FB7）。CP932 の拡張領域にあるが、JIS X 0208 にはない"

# --- Unicode の正規化（NFC）で別の文字に変わるもの ---

[[surname]]
id = "nfc-otsuka"
value = "大塚"
base = "大塚"
kana = "オオツカ"
romaji = "Otsuka"
tags = ["kanji_variant", "cp932_only", "nfc_changes"]
note = "「塚」の互換漢字（U+FA10）。NFC で正規化すると通常の「塚」（U+585A）に変わる。正規化してから保存・比較する処理と、しない処理が混在すると一致しなくなる"

[[surname]]
id = "nfc-iizuka"
value = "飯塚"
base = "飯塚"
kana = "イイヅカ"
romaji = "Iizuka"
tags = ["kanji_variant", "cp932_only", "nfc_changes"]
note = "「塚」の互換漢字（U+FA10）を含む。大塚と同じ性質。読みに「ヅ」を含む"

# --- サロゲートペア（U+10000 以降の文字）---

[[surname]]
id = "surrogate-yoshida"
value = "\U00020BB7田"
base = "吉田"
kana = "ヨシダ"
romaji = "Yoshida"
tags = ["kanji_variant", "surrogate_pair", "cp932_unmappable"]
note = "「𠮷」（つちよし、U+20BB7）。UTF-16 では 2 単位、UTF-8 では 4 バイト。文字数の数え方や、文字単位の切り詰めで壊れやすい。CP932 には変換できない"

[[surname]]
id = "surrogate-yoshikawa"
value = "\U00020BB7川"
base = "吉川"
kana = "ヨシカワ"
romaji = "Yoshikawa"
tags = ["kanji_variant", "surrogate_pair", "cp932_unmappable"]
note = "「𠮷」（U+20BB7）を含む。𠮷田と同じ性質"

[[surname]]
id = "surrogate-tsuchiya"
value = "\U0002123D屋"
base = "土屋"
kana = "ツチヤ"
romaji = "Tsuchiya"
tags = ["kanji_variant", "surrogate_pair", "cp932_unmappable"]
note = "「𡈽」（土に点、U+2123D）。サロゲートペアで、CP932 には変換できない"

# --- 異体字セレクタ（IVS）付き ---

[[surname]]
id = "ivs-katsuragi"
value = "葛\U000E0100城"
base = "葛城"
kana = "カツラギ"
romaji = "Katsuragi"
tags = ["kanji_variant", "ivs", "surrogate_pair", "cp932_unmappable"]
note = "「葛」に異体字セレクタ（U+E0100）が付いている。見た目は 1 文字でもコードポイントは 2 つ。異体字セレクタ自体も U+10000 以降の文字なので、UTF-16 ではサロゲートペアになる。セレクタを落とすと字形が変わり、セレクタの直前で切り詰めると壊れる。表示される字形はフォントによる"

[[surname]]
id = "ivs-tsuji"
value = "辻\U000E0101"
base = "辻"
kana = "ツジ"
romaji = "Tsuji"
tags = ["kanji_variant", "ivs", "surrogate_pair", "cp932_unmappable", "single_char"]
note = "「辻」に異体字セレクタ（U+E0101）が付いている。見た目は 1 文字だがコードポイントは 2 つで、文字数の上限チェックや 1 文字の姓の扱いで問題になる"

